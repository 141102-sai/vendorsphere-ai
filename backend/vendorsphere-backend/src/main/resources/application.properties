spring.application.name=vendorsphere-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vendorsphere_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET_BASE64}
jwt.expiration=900000
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}

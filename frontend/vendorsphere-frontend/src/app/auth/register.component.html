<main class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Create your account</mat-card-title>
      <mat-card-subtitle>Start managing vendor risk and compliance</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <div class="name-fields">
          <mat-form-field appearance="outline">
            <mat-label>First name</mat-label>
            <input matInput formControlName="firstName" autocomplete="given-name">
            <mat-error *ngIf="form.controls.firstName.invalid">Enter your first name.</mat-error>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Last name</mat-label>
            <input matInput formControlName="lastName" autocomplete="family-name">
            <mat-error *ngIf="form.controls.lastName.invalid">Enter your last name.</mat-error>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email">
          <mat-error *ngIf="form.controls.email.invalid">Enter a valid email address.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="new-password">
          <mat-hint>At least 8 characters</mat-hint>
          <mat-error *ngIf="form.controls.password.invalid">Password must be at least 8 characters.</mat-error>
        </mat-form-field>

        <p class="form-error" role="alert" *ngIf="errorMessage">{{ errorMessage }}</p>
        <button mat-flat-button color="primary" type="submit" [disabled]="loading">
          {{ loading ? 'Creating account…' : 'Create account' }}
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <a mat-button routerLink="/login">Already have an account? Sign in</a>
    </mat-card-actions>
  </mat-card>
</main>
